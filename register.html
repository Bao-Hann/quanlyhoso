<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng ký</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-sm p-4" style="width:100%;max-width:470px">
    <h3 class="text-center mb-4">Tạo tài khoản</h3>
    <form method="post">{% csrf_token %}
      {% for field in form %}
      <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}</div>
      {% endfor %}
      <button class="btn btn-primary w-100">Đăng ký</button>
    </form>
    <div class="text-center mt-3"><a href="{% url 'login' %}">Đã có tài khoản</a></div>
  </div>
</div>
<script>document.querySelectorAll('input').forEach(x=>x.classList.add('form-control'));</script>
</body></html>
