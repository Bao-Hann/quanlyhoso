<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Hồ sơ khoa học</title>
  <link rel="stylesheet" href="./auth.css?v=2">
</head>
<body>
  <nav class="auth-navbar"><div class="auth-nav-inner">
    <a href="./login.html" class="auth-brand">📄 Hồ sơ khoa học</a>
    <div class="auth-nav-actions"><a href="./login.html" class="auth-btn auth-btn-outline">Login</a></div>
  </div></nav>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header"><h1>Create Account</h1><p>Join us and build your scientific profile</p></div>
      <div id="authMessage" class="d-none"></div>
      <form id="registerForm" class="auth-form" novalidate>
        <div class="auth-group"><label for="id_username">Username</label><input class="auth-input" id="id_username" name="username" placeholder="Choose a username" autocomplete="username" required><small class="auth-help">Letters, digits and @/./+/-/_ only.</small></div>
        <div class="auth-group"><label for="id_email">Email</label><input class="auth-input" type="email" id="id_email" name="email" placeholder="Enter your email" autocomplete="email" required></div>
        <div class="auth-group"><label for="id_password1">Password</label><input class="auth-input" type="password" id="id_password1" name="password1" placeholder="Create a password" autocomplete="new-password" required><small class="auth-help">At least 8 characters and not entirely numeric.</small></div>
        <div class="auth-group"><label for="id_password2">Confirm Password</label><input class="auth-input" type="password" id="id_password2" name="password2" placeholder="Confirm your password" autocomplete="new-password" required></div>
        <button class="auth-btn auth-btn-primary auth-btn-full" type="submit">Create Account</button>
      </form>
      <div class="auth-footer"><p>Already have an account? <a href="./login.html">Login here</a></p></div>
    </div>
  </main>
  <footer class="auth-footerbar">© 2026 Hồ sơ khoa học</footer>
  <script src="./auth.js?v=2"></script>
</body></html>
