    const name = String(session.name || session.displayName || session.username || email.split('@')[0] || '').trim();
    ['authUsername', 'welcomeName', 'dashboardWelcomeName'].forEach(id => {

  const toast = (message, kind='success') => {

    const cls = kind === 'danger' ? 'danger' : kind === 'warning' ? 'warning' : kind === 'info' ? 'info' : 'success';

  const editBtn = document.getElementById('editGeneralBtn');
  const saveBtn = document.getElementById('saveGeneralBtn');
  const fields = document.querySelectorAll('.general-field');

  if (editBtn) {

  const generalForm = document.getElementById('editGeneral');
  const identity = window.GAS_USER || window.OneFormAuth?.getSession?.() || {};
  const accountId = identity.email ? ('email:' + identity.email.trim().toLowerCase()) : identity.userId || identity.username || 'local-user';
  const authToken = window.GAS_AUTH_TOKEN || '';
  const ownsCurrentSession = () => !window.OneFormAuth || (window.OneFormAuth.getSession?.()?.email || '') === (identity.email || '');
  const generalKey = 'scientist-general-v2:' + accountId;
  const readGeneral = () => Object.fromEntries([...fields]
    .filter(el => el.name && (el.type !== 'radio' || el.checked))
    .map(el => [el.name, el.type === 'checkbox' ? el.checked : el.value]));
  const applyGeneral = data => {
    fields.forEach(el => {
      if (!Object.prototype.hasOwnProperty.call(data || {}, el.name)) return;
      if (el.type === 'radio') el.checked = String(data[el.name]) === el.value;
      else if (el.type === 'checkbox') el.checked = Boolean(data[el.name]);
      else el.value = data[el.name] ?? '';
    });
    syncAccountIdentity();
  };
  let generalReady = !window.google?.script?.run;
  if (window.google?.script?.run) {
    if (editBtn) editBtn.disabled = true;
    google.script.run.withSuccessHandler(result => {
      if (result.user) window.GAS_USER = result.user;
      applyGeneral(result.data || {}); generalReady = true;
      if (editBtn) editBtn.disabled = false;
    }).withFailureHandler(err => {
      toast('Không tải được hồ sơ: ' + err.message, 'danger');
    }).loadGeneral(authToken);
  } else {
    try { applyGeneral(JSON.parse(localStorage.getItem(generalKey) || '{}')); }

  }
  generalForm?.addEventListener('submit', event => {

    if (!ownsCurrentSession()) { toast('Tài khoản đã thay đổi. Hãy tải lại trang trước khi lưu.', 'danger'); return; }
    if (!generalReady || !generalForm.reportValidity()) return;
    const data = readGeneral(); saveBtn.disabled = true;
    const done = () => {
      applyGeneral(data); fields.forEach(el => el.disabled = true);
      editBtn.style.display = ''; saveBtn.style.display = 'none'; saveBtn.disabled = false;
      toast('Đã lưu thông tin cá nhân.');
    };
    const failed = err => { saveBtn.disabled = false; toast('Không lưu được: ' + err.message, 'danger'); };
    if (window.google?.script?.run) google.script.run.withSuccessHandler(done).withFailureHandler(failed).saveGeneral(data, authToken);
    else { try { localStorage.setItem(generalKey, JSON.stringify(data)); done(); } catch (err) { failed(err); } }

  // Store the scientific CV in this browser, separately for each account.
  const supportForm = document.getElementById('supportForm');
  const supportStatus = document.getElementById('supportFileStatus');
  let supportUrl;
  const openPdfDb = () => new Promise((resolve, reject) => {
    const request = indexedDB.open('scientist-support-v1', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('cv');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  const showPdf = record => {
    if (!supportStatus) return;
    supportStatus.replaceChildren();
    if (supportUrl) URL.revokeObjectURL(supportUrl);
    if (!record) return;
    supportUrl = URL.createObjectURL(record.file);
    const link = document.createElement('a'); link.href = supportUrl;
    link.download = record.name; link.textContent = 'Mở PDF đã lưu: ' + record.name;
    supportStatus.appendChild(link);
  };
  const readPdf = async () => {
    const db = await openPdfDb();
    await new Promise((resolve,reject) => {
      const tx=db.transaction('cv','readonly'), request=tx.objectStore('cv').get(accountId);
      request.onsuccess=()=>showPdf(request.result);
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
    }).finally(()=>db.close());
  };
  if (supportForm) readPdf().catch(() => { if(supportStatus) supportStatus.textContent='Không đọc được PDF đã lưu trong trình duyệt.'; });
  supportForm?.addEventListener('submit', async event => {
    event.preventDefault();
    const file=document.getElementById('supportFile')?.files?.[0];
    if (!file) return;
    const button=supportForm.querySelector('[type="submit"]'); button.disabled=true;
    try {
      const signature=new TextDecoder().decode(await file.slice(0,5).arrayBuffer());
      if (!/\.pdf$/i.test(file.name) || signature !== '%PDF-' || (file.type && file.type !== 'application/pdf')) throw new Error('Chỉ nhận tệp PDF hợp lệ.');
      if (file.size > 20*1024*1024) throw new Error('PDF không được lớn hơn 20 MB.');
      const db=await openPdfDb();
      const record={file,name:file.name,updatedAt:new Date().toISOString()};
      await new Promise((resolve,reject)=>{
        const tx=db.transaction('cv','readwrite'); tx.objectStore('cv').put(record,accountId);
        tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error||new Error('Trình duyệt không cho lưu tệp.'));
      }).finally(()=>db.close());
      showPdf(record); supportForm.reset(); toast('Đã lưu PDF trong ứng dụng trên trình duyệt này.');
    } catch(err) { toast(err.message,'danger'); }
    finally { button.disabled=false; }
  });

  // Demo lưu cục bộ trên GitHub Pages để có thể thử giao diện.

  const degreeThesisLabel = document.getElementById('degreeThesisLabel');
  const credentialEditKey = document.getElementById('credentialEditKey');
  const credentialSelectAll = document.getElementById('credentialSelectAll');
  const credentialSelectAllBtn = document.getElementById('credentialSelectAllBtn');
  const credentialClearSelectionBtn = document.getElementById('credentialClearSelectionBtn');
  const credentialDeleteSelectedBtn = document.getElementById('credentialDeleteSelectedBtn');

  if (degreeYear) degreeYear.max = String(currentYear);

  const updateDegreeThesisLabel = () => {
    if (!degreeThesisLabel || !degreeLevel) return;
    const value = degreeLevel.value;
    let label = 'Khóa luận/Luận văn/Luận án';
    if (value === 'Cử nhân' || value === 'Kỹ sư') label = 'Khóa luận';

    const doi = String(article.doi || article.doi_or_url || '').trim().toLowerCase()
      .replace(/^https?:\/\/(dx\.)?doi\.org\//i,'')
      .replace(/^doi:\s*/i,'');
    if (doi && /^10\.\d{4,9}\//i.test(doi)) return 'doi:' + doi;
    return 'meta:' + [article.title, article.journal || article.location, article.year]
      .map(v => String(v || '').trim().toLowerCase().replace(/\s+/g,' ')).join('|');
  };

    const editingKey = article.editingKey || '';
    const existing = [...body.querySelectorAll('tr:not(.empty-row)')].find(row => row.dataset.articleKey === key && row.dataset.articleKey !== editingKey);

    if (existing) {
      toast('Bài báo này đã có trong hồ sơ. Hệ thống không thêm bản trùng.', 'warning');
      return false;
    }

    if (editingKey) {
      const oldRow = [...body.querySelectorAll('tr:not(.empty-row)')].find(row => row.dataset.articleKey === editingKey);
      if (oldRow) {
        publicationEvidenceFiles.delete(editingKey);

      tablesLoading=true;restoreTables(result.data||{});tablesReady=true;
      setTimeout(()=>{tablesLoading=false;},0);
    }).withFailureHandler(err=>toast('Không tải được các mục hồ sơ: '+err.message,'danger')).loadTables(authToken);
  } else {
    try {restoreTables(JSON.parse(localStorage.getItem(profileDataKey)||'{}'));}catch(err){toast('Không đọc được các mục hồ sơ đã lưu.','danger');}
  }
  document.querySelectorAll('.modal form').forEach(form=>form.addEventListener('submit',event=>{
    if(!tablesReady || !ownsCurrentSession()) {event.preventDefault();event.stopImmediatePropagation();toast('Hồ sơ chưa tải xong hoặc tài khoản đã đổi. Hãy tải lại trang.','warning');}
  },true));
  if(window.MutationObserver) {
    const watcher=new window.MutationObserver(()=>{
      if(tablesLoading || !tablesReady) return;
      clearTimeout(saveTimer);saveTimer=setTimeout(flushTables,500);
    });
    profileBodies.forEach(body=>watcher.observe(body,{childList:true,subtree:true,attributes:true,attributeFilter:['data-key','data-title','data-description']}));
  }

});
</script>
