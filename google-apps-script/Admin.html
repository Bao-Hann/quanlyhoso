<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    :root{--bg:#f7f4f1;--card:#fff;--ink:#201c19;--muted:#756d67;--line:#e8e1db;--orange:#d96f2b;--orange2:#a94e17}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .top{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
    .top h1{margin:0;font-size:1.1rem}.top a{color:var(--orange2);font-weight:700;text-decoration:none}
    .shell{max-width:1280px;margin:0 auto;padding:32px 24px 50px}
    .hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.hero h2{font-size:2rem;margin:0 0 8px}.hero p{margin:0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:22px 0 28px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(60,45,35,.04)}
    .stat strong{display:block;font-size:2rem;margin-bottom:5px}.stat span{color:var(--muted);font-size:.86rem}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(60,45,35,.05)}
    .tools{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
    .tools input{width:min(420px,100%);padding:11px 13px;border:1px solid #d9d1cb;border-radius:10px;font:inherit}
    table{width:100%;border-collapse:collapse}th,td{padding:13px 14px;border-bottom:1px solid #eee8e3;text-align:left;vertical-align:middle;font-size:.88rem}
    th{background:#fffaf6;color:#655c56;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
    .name{font-weight:750}.email{color:var(--muted);font-size:.82rem;margin-top:3px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f2eee9;font-size:.76rem;font-weight:700}
    .bar{width:100px;height:7px;background:#eee8e3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange)}
    .muted{color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}.error{padding:18px;color:#9d2c20;background:#fff1ee;border-radius:12px}
    @media(max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}.table-wrap{overflow:auto}table{min-width:980px}}
  </style>
</head>
<body>
  <header class="top">
    <h1>Scientist Profile · Admin</h1>
    <a href="<?= webAppUrl ?>?page=app" target="_top">Về hồ sơ của tôi</a>
  </header>

  <main class="shell">
    <section class="hero">
      <div><h2>Dashboard người dùng</h2><p id="adminLine">Đang tải dữ liệu...</p></div>
    </section>

    <div id="errorBox"></div>

    <section class="stats">
      <div class="stat"><strong id="sTotal">—</strong><span>Tổng người dùng đã ghi nhận</span></div>
      <div class="stat"><strong id="s7">—</strong><span>Hoạt động 7 ngày</span></div>
      <div class="stat"><strong id="s30">—</strong><span>Hoạt động 30 ngày</span></div>
      <div class="stat"><strong id="sProfile">—</strong><span>Đã tạo hồ sơ</span></div>
      <div class="stat"><strong id="sAcademic">—</strong><span>Có dữ liệu học thuật</span></div>
    </section>

    <section class="panel">
      <div class="tools"><input id="search" type="search" placeholder="Tìm theo tên hoặc email..." disabled></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Người dùng</th><th>Họ tên hồ sơ</th><th>Hoàn thiện</th><th>Lượt truy cập</th><th>Lần đầu</th><th>Gần nhất</th><th>Dữ liệu</th></tr></thead>
          <tbody id="rows"><tr><td colspan="7" class="empty">Đang tải...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

<script>
  let allUsers=[];
  const fmt=value=>{
    if(!value)return '—';
    const d=new Date(value); if(Number.isNaN(d.getTime()))return '—';
    return new Intl.DateTimeFormat('vi-VN',{dateStyle:'short',timeStyle:'short'}).format(d);
  };
  const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const render=users=>{
    const body=document.getElementById('rows');
    if(!users.length){body.innerHTML='<tr><td colspan="7" class="empty">Chưa có người dùng phù hợp.</td></tr>';return;}
    body.innerHTML=users.map(u=>`
      <tr>
        <td><div class="name">${esc(u.accountName||'(chưa có tên Google)')}</div><div class="email">${esc(u.email)}</div></td>
        <td>${esc(u.profileName||'—')}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:${Number(u.completion)||0}%"></i></div><span>${Number(u.completion)||0}%</span></div></td>
        <td>${Number(u.visits)||0}</td>
        <td class="muted">${fmt(u.firstSeen)}</td>
        <td class="muted">${fmt(u.lastSeen)}</td>
        <td><span class="pill">${u.hasAcademicData?'Có học thuật':(u.hasProfile?'Hồ sơ cơ bản':'Chưa có')}</span></td>
      </tr>`).join('');
  };
  const ok=data=>{
    document.getElementById('adminLine').textContent='Đăng nhập quản trị: '+(data.admin.name||data.admin.email);
    document.getElementById('sTotal').textContent=data.stats.totalUsers;
    document.getElementById('s7').textContent=data.stats.active7d;
    document.getElementById('s30').textContent=data.stats.active30d;
    document.getElementById('sProfile').textContent=data.stats.profilesCreated;
    document.getElementById('sAcademic').textContent=data.stats.academicDataUsers;
    allUsers=data.users||[];render(allUsers);
    const search=document.getElementById('search');search.disabled=false;
    search.addEventListener('input',()=>{
      const q=search.value.trim().toLowerCase();
      render(!q?allUsers:allUsers.filter(u=>[u.email,u.accountName,u.profileName].some(v=>String(v||'').toLowerCase().includes(q))));
    });
  };
  const fail=err=>{document.getElementById('errorBox').innerHTML='<div class="error">'+esc(err.message||err)+'</div>';document.getElementById('rows').innerHTML='<tr><td colspan="7" class="empty">Không tải được dữ liệu.</td></tr>';};
  google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getAdminDashboard();
</script>
</body>
</html>
