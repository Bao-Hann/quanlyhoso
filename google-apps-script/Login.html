<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Scientist Profile</title>
  <style>
    :root{
      --orange-50:#fffaf6;
      --orange-100:#fff1e7;
      --orange-200:#fbdcc6;
      --orange-300:#f3bc94;
      --orange-500:#dc7a37;
      --orange-600:#c8682a;
      --orange-700:#9f4f1d;
      --ink:#231f1c;
      --muted:#746d67;
      --line:#e9e4df;
      --surface:#ffffff;
      --shadow:0 30px 80px rgba(111,63,29,.18),0 8px 24px rgba(111,63,29,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 16%,rgba(255,255,255,.48) 0 12%,transparent 32%),
        radial-gradient(circle at 88% 82%,rgba(255,255,255,.28) 0 10%,transparent 30%),
        linear-gradient(135deg,#ef9a62 0%,#f4b079 48%,#f8c899 100%);
    }
    button,input,a{font:inherit}
    button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid rgba(220,122,55,.24);outline-offset:2px}
    .shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 28px}
    .card{
      width:min(1060px,100%);
      min-height:680px;
      display:grid;
      grid-template-columns:1fr 1fr;
      overflow:hidden;
      background:var(--surface);
      border:1px solid rgba(255,255,255,.72);
      border-radius:28px;
      box-shadow:var(--shadow);
    }
    .brand{
      position:relative;
      isolation:isolate;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 54px;
      overflow:hidden;
      background:linear-gradient(160deg,#fffdfa 0%,#fff8f2 62%,#fdf2e9 100%);
      border-right:1px solid #f0e7df;
    }
    .brand::before,.brand::after{
      content:"";
      position:absolute;
      z-index:-1;
      border-radius:50%;
      filter:blur(1px);
      pointer-events:none;
    }
    .brand::before{width:260px;height:260px;left:-120px;top:-110px;background:rgba(225,126,58,.11)}
    .brand::after{width:220px;height:220px;right:-110px;bottom:-95px;background:rgba(225,126,58,.08)}
    .brand-content{width:100%;max-width:390px;text-align:center}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin:0 0 20px;
      padding:8px 13px;
      border:1px solid var(--orange-200);
      border-radius:999px;
      background:rgba(255,255,255,.8);
      color:var(--orange-700);
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.13em;
      text-transform:uppercase;
    }
    .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange-500);box-shadow:0 0 0 4px rgba(220,122,55,.12)}
    .tree{
      display:flex;
      align-items:center;
      justify-content:center;
      width:300px;
      height:258px;
      max-width:100%;
      margin:0 auto 18px;
      overflow:hidden;
      border:1px solid rgba(200,104,42,.10);
      border-radius:22px;
      background:
        radial-gradient(circle at 55% 38%,rgba(244,138,72,.28) 0 18%,rgba(244,138,72,.10) 38%,transparent 62%),
        linear-gradient(135deg,#e6dbd5 0%,#f7c4a2 48%,#ffe5cc 100%);
      box-shadow:0 14px 34px rgba(111,63,29,.10);
    }
    .tree img{
      display:block;
      width:72%;
      height:72%;
      object-fit:contain;
      object-position:center;
    }
    .brand h1{margin:0;color:#2c2520;font-size:2.08rem;font-weight:760;letter-spacing:-.035em}
    .brand p{max-width:310px;margin:12px auto 0;color:#746b64;font-size:1.02rem;line-height:1.65}
    .form-panel{display:flex;align-items:center;justify-content:center;padding:52px 48px;background:#fff}
    .wrap{width:100%;max-width:430px}
    .form-head{text-align:center;margin-bottom:30px}
    .wrap h2{margin:0;font-size:2.35rem;line-height:1.15;font-weight:730;letter-spacing:-.035em}
    .form-subtitle{margin:10px 0 0;color:var(--muted);font-size:.96rem;line-height:1.55}
    .notice{padding:12px 14px;border:1px solid #f0d6a8;border-radius:10px;background:#fff8e8;color:#6f511d;margin-bottom:20px;font-size:.93rem;line-height:1.5}
    .field{margin-bottom:20px}
    .field label{display:block;margin-bottom:8px;color:#37312d;font-size:.94rem;font-weight:650}
    .field input{
      width:100%;
      height:54px;
      border:1px solid #ddd8d3;
      border-radius:11px;
      padding:0 16px;
      background:#fff;
      color:#241f1c;
      font-size:1rem;
      transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
    }
    .field input::placeholder{color:#aaa39d}
    .field input:hover{border-color:#cfc7c0}
    .field input:focus{border-color:var(--orange-500);box-shadow:0 0 0 4px rgba(220,122,55,.10);background:#fffdfb;outline:0}
    .primary{
      width:100%;
      min-height:56px;
      border:0;
      border-radius:11px;
      background:linear-gradient(135deg,var(--orange-600),#d97835);
      color:#fff;
      font-size:1rem;
      font-weight:750;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(200,104,42,.20);
      transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
    }
    .primary:hover:not(:disabled){transform:translateY(-1px);filter:saturate(1.04);box-shadow:0 14px 28px rgba(200,104,42,.25)}
    .primary:active:not(:disabled){transform:translateY(0)}
    .primary:disabled{opacity:.62;cursor:wait}
    .separator{position:relative;border:0;border-top:1px solid var(--line);margin:24px 0}
    .google{
      width:100%;
      min-height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      border:1px solid #ddd8d3;
      border-radius:11px;
      background:#fff;
      color:#403a36;
      font-size:.98rem;
      font-weight:680;
      cursor:pointer;
      text-decoration:none;
      transition:border-color .18s ease,background .18s ease,transform .18s ease;
    }
    .google:hover{border-color:#c9c1ba;background:#fcfbfa;transform:translateY(-1px)}
    .register{text-align:center;color:#716a64;font-size:.94rem;margin:24px 0 0}
    .register button{padding:0 3px;background:none;border:0;color:var(--orange-700);font-size:inherit;font-weight:750;cursor:pointer}
    .register button:hover{text-decoration:underline}
    .privacy{
      max-width:390px;
      margin:18px auto 0;
      color:#98918b;
      font-size:.78rem;
      line-height:1.55;
      text-align:center;
    }
    @media(max-width:850px){
      .shell{padding:20px 14px}
      .card{grid-template-columns:1fr;min-height:auto;border-radius:22px}
      .brand{padding:30px 24px;border-right:0;border-bottom:1px solid #f0e7df}
      .eyebrow{margin-bottom:14px}
      .tree{width:220px;height:190px;margin-bottom:14px;border-radius:18px}
      .brand h1{font-size:1.7rem}
      .brand p{font-size:.92rem}
      .form-panel{padding:34px 24px 38px}
      .wrap h2{font-size:2rem}
    }
    @media(max-width:480px){
      .brand{padding:24px 18px}.form-panel{padding:28px 18px 32px}
      .tree{width:190px;height:164px}
      .form-subtitle{font-size:.9rem}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="brand">
        <div class="brand-content">
          <div class="eyebrow">Hồ sơ khoa học</div>
          <div class="tree"><img src="https://sdfestaticassets-eu-west-1.sciencedirectassets.com/shared-assets/24/images/elsevier-non-solus-new-grey.svg" alt="Biểu tượng Non Solus" loading="eager" decoding="async"></div>
          <h1>Scientist Profile</h1>
          <p>Kết nối các nhà nghiên cứu Việt Nam</p>
        </div>
      </div>
      <div class="form-panel">
        <div class="wrap">
          <div class="form-head">
            <h2>Đăng nhập</h2>
            <p class="form-subtitle">Quản lý hồ sơ khoa học, minh chứng và biểu mẫu của bạn tại một nơi.</p>
          </div>
          <? if (message) { ?><div class="notice"><?= message ?></div><? } ?>
          <div id="authMessage" class="notice" role="status" hidden></div>
          <form id="loginForm">
            <div class="field" id="accountNameField" hidden><label for="accountName">Tên tài khoản</label><input id="accountName" type="text" autocomplete="name" placeholder="Ví dụ: Huỳnh Bảo Hân" maxlength="100" disabled></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="Email" required maxlength="254"></div>
            <div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required maxlength="128"></div>
            <div class="field" id="confirmField" hidden><label for="confirmPassword">Xác nhận mật khẩu</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" maxlength="128" disabled></div>
            <button class="primary" id="submitLogin" type="submit">Đăng nhập</button>
          </form>
          <hr class="separator">
          <a class="google" id="googleOAuthBtn" href="<?= googleAccountChooserUrl ?>" target="_top" rel="noopener">
            <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M22 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.4 3.1-7.6"/><path fill="#34a853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10.4 10.4 0 0 0 12 22"/><path fill="#fbbc05" d="M6.2 13.6a6.2 6.2 0 0 1 0-3.2V7.7H2.7a10.3 10.3 0 0 0 0 8.6z"/><path fill="#ea4335" d="M12 6.1c1.5 0 2.9.5 4 1.6l3-3A10 10 0 0 0 2.7 7.7l3.5 2.7C7 7.9 9.3 6.1 12 6.1"/></svg>
            <span>Đăng nhập bằng tài khoản Google</span>
          </a>
          <p class="register"><span id="accountPrompt">Chưa có tài khoản?</span> <button id="registerToggle" type="button">Đăng ký</button></p>
          <p class="privacy">Google sẽ cho bạn chọn tài khoản trước khi mở hồ sơ.</p>
        </div>
      </div>
    </section>
  </main>
<script>
  const appUrl = <?!= JSON.stringify(webAppUrl) ?>;
  let registering=false;
  const form=document.getElementById('loginForm'),button=document.getElementById('submitLogin'),message=document.getElementById('authMessage');
  const show=text=>{message.textContent=text;message.hidden=false;};
  const setRegistration=enabled=>{
    registering=enabled;
    button.textContent=enabled?'Đăng ký':'Đăng nhập';
    document.querySelector('.wrap h2').textContent=enabled?'Đăng ký tài khoản':'Đăng nhập';
    document.getElementById('accountPrompt').textContent=enabled?'Đã có tài khoản?':'Chưa có tài khoản?';
    document.getElementById('registerToggle').textContent=enabled?'Đăng nhập':'Đăng ký';
    const accountNameField=document.getElementById('accountNameField');
    const accountName=document.getElementById('accountName');
    accountNameField.hidden=!enabled;accountName.disabled=!enabled;accountName.required=enabled;
    if(!enabled)accountName.value='';
    document.getElementById('password').autocomplete=enabled?'new-password':'current-password';
    document.getElementById('password').minLength=enabled?12:1;
    document.getElementById('password').value='';
    document.getElementById('confirmField').hidden=!enabled;
    const confirm=document.getElementById('confirmPassword');confirm.disabled=!enabled;confirm.required=enabled;confirm.value='';
    message.hidden=true;
    if(enabled)show('Đăng ký tài khoản mới với mật khẩu từ 12 ký tự. Tài khoản Google đang đăng nhập phải trùng với email bạn đăng ký để xác nhận quyền sở hữu email.');
  };
  document.getElementById('registerToggle').addEventListener('click',()=>{if(!button.disabled)setRegistration(!registering);});
  form.addEventListener('submit',event=>{
    event.preventDefault();if(!form.reportValidity())return;
    if(registering && document.getElementById('password').value!==document.getElementById('confirmPassword').value){show('Mật khẩu xác nhận chưa khớp. Hãy nhập lại.');return;}
    button.disabled=true;show('Đang kiểm tra, vui lòng chờ…');
    const done=result=>{
      button.disabled=false;document.getElementById('password').value='';
      if(registering){setRegistration(false);show('Đăng ký thành công. Bạn có thể đăng nhập bằng tài khoản vừa tạo.');return;}
      try {sessionStorage.setItem('scientist-local-session',JSON.stringify(result));}
      catch(_){show('Trình duyệt không cho lưu phiên đăng nhập. Hãy cho phép lưu dữ liệu của trang.');return;}
      window.top.location.href=appUrl+'?page=app&mode=local';
    };
    const fail=error=>{button.disabled=false;document.getElementById('password').value='';show(error.message);};
    const runner=google.script.run.withSuccessHandler(done).withFailureHandler(fail);
    const email=document.getElementById('email').value,password=document.getElementById('password').value;
    const accountName=document.getElementById('accountName').value;
    if(registering)runner.registerLocal(email,password,accountName);else runner.loginLocal(email,password);
  });
</script>
</body>
</html>
