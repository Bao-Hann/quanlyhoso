    .wrap h2{text-align:center;margin:0 0 42px;font-size:2.9rem;font-weight:500}
    .notice{padding:12px 14px;border-radius:8px;background:#fff3cd;color:#664d03;margin-bottom:22px}
    .google{width:100%;min-height:69px;display:flex;align-items:center;justify-content:center;gap:14px;border:1px solid #dadada;border-radius:8px;background:#fff;color:#484848;font-size:1.2rem;font-weight:700;cursor:pointer;text-decoration:none}
    .google:hover{background:#fafafa}.g{font-size:1.65rem;font-weight:800;color:#4285f4}
    .field{margin-bottom:28px}.field label{display:block;font-size:1.35rem;margin-bottom:14px}.field input{width:100%;height:56px;border:1px solid #d8dee4;border-radius:8px;padding:14px 18px;font-size:1.3rem}.primary{width:100%;min-height:66px;border:0;border-radius:8px;background:#aa2828;color:#fff;font-size:1.4rem;cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.separator{border:0;border-top:1px solid #ccc;margin:24px 0}.register{text-align:center;font-size:1.15rem;margin:30px 0 0}.register button{background:none;border:0;color:#aa2828;font-size:inherit;cursor:pointer}.desc{text-align:center;color:#555;line-height:1.6;margin:0 0 28px}.privacy{text-align:center;color:#777;font-size:.9rem;margin-top:24px}
    @media(max-width:850px){.card{grid-template-columns:1fr}.brand{padding:34px 24px}.tree{width:220px}.form-panel{padding:34px 24px}.wrap h2{font-size:2.15rem;margin-bottom:28px}}

          <a class="google" href="<?= webAppUrl ?>?page=app">
            <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M22 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.4 3.1-7.6"/><path fill="#34a853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10.4 10.4 0 0 0 12 22"/><path fill="#fbbc05" d="M6.2 13.6a6.2 6.2 0 0 1 0-3.2V7.7H2.7a10.3 10.3 0 0 0 0 8.6z"/><path fill="#ea4335" d="M12 6.1c1.5 0 2.9.5 4 1.6l3-3A10 10 0 0 0 2.7 7.7l3.5 2.7C7 7.9 9.3 6.1 12 6.1"/></svg>
            <span>Đăng nhập bằng tài khoản Google</span>

          <p class="register">Chưa có mật khẩu? <button id="registerToggle" type="button">Tạo mật khẩu</button></p>
          <p class="privacy">Cùng email dùng chung hồ sơ. Tạo mật khẩu cần xác nhận bằng tài khoản Google của bạn. Không nhập mật khẩu Google vào ô này.</p>

<script>
  const appUrl = <?!= JSON.stringify(webAppUrl) ?>;
  let registering=false;
  const form=document.getElementById('loginForm'),button=document.getElementById('submitLogin'),message=document.getElementById('authMessage');
  const show=text=>{message.textContent=text;message.hidden=false;};
  document.getElementById('registerToggle').addEventListener('click',()=>{
    registering=!registering;button.textContent=registering?'Tạo mật khẩu':'Đăng nhập';
    document.getElementById('registerToggle').textContent=registering?'Quay lại đăng nhập':'Tạo mật khẩu';
    document.getElementById('password').autocomplete=registering?'new-password':'current-password';
    document.getElementById('password').minLength=registering?12:1;
    if(registering) show('Tạo mật khẩu riêng từ 12 ký tự. Tài khoản Google đang đăng nhập phải trùng với email bạn nhập.');else message.hidden=true;
  });
  form.addEventListener('submit',event=>{
    event.preventDefault();if(!form.reportValidity())return;
    button.disabled=true;show('Đang kiểm tra, vui lòng chờ…');
    const done=result=>{
      button.disabled=false;document.getElementById('password').value='';
      if(registering){show('Đã tạo mật khẩu. Bạn có thể quay lại đăng nhập.');return;}
      try {sessionStorage.setItem('scientist-local-session',JSON.stringify(result));}
      catch(_){show('Trình duyệt không cho lưu phiên đăng nhập. Hãy cho phép lưu dữ liệu của trang.');return;}
      window.top.location.href=appUrl+'?page=app&mode=local';
    };
    const fail=error=>{button.disabled=false;document.getElementById('password').value='';show(error.message);};
    const runner=google.script.run.withSuccessHandler(done).withFailureHandler(fail);
    const email=document.getElementById('email').value,password=document.getElementById('password').value;
    if(registering)runner.registerLocal(email,password);else runner.loginLocal(email,password);
  });
</script>
