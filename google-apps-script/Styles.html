<style>
html { scroll-behavior: smooth; }
body { background:#fff; color:#212529; }
.sidebar {
    height: 100vh;

}
.sidebar .nav-link { padding: 8px 16px; transition: background-color .2s; border-radius:4px; }
.sidebar .nav-link:hover, .sidebar .nav-link.active { background-color:#7db0e2c6; }
section { padding-top:35px; }

.full-screen-section>.container { width:100%; }
.welcome-section { align-items:flex-start; padding-top:70px; }

.fixed-modal { width:900px; min-height:420px; max-width:100%; max-height:88vh; overflow-y:auto; margin:auto; }
.modal { --bs-modal-width:900px; --bs-modal-header-padding-x:1rem; }
.table-wrapper { max-height:38rem; overflow-y:auto; }
.addition-table-wrapper { max-height:19rem; overflow-y:auto; }
thead { position:sticky; top:0; background:#fff; z-index:100; }
.box-title { margin:auto; padding:0 15px 0 10px; font-size:20px; background:#fff; position:relative; top:-35px; right:-10px; display:inline-block; }

.content-header { margin-bottom:1rem; }
.table td, .table th { vertical-align:middle; }

/* ===== Theme system ===== */
:root{
  --theme-bg:#ffffff;
  --theme-surface:#ffffff;
  --theme-sidebar:#eef3fbc6;
  --theme-accent:#0d6efd;
  --theme-accent-2:#7db0e2c6;
  --theme-text:#212529;
  --theme-muted:#6c757d;
  --theme-border:#dee2e6;
}

body{
  background:var(--theme-bg);
  color:var(--theme-text);
  transition:background-color .2s ease,color .2s ease;
}
.sidebar{background:var(--theme-sidebar)!important;color:var(--theme-text);}
.sidebar .nav-link{color:var(--theme-text)!important;}
.sidebar .nav-link:hover,.sidebar .nav-link.active{background:var(--theme-accent-2);}
.btn-primary{background-color:var(--theme-accent);border-color:var(--theme-accent);}
.btn-primary:hover,.btn-primary:focus{filter:brightness(.93);background-color:var(--theme-accent);border-color:var(--theme-accent);}
.modal-content,.dropdown-menu,.table,.form-control,.form-select,.input-group-text{
  background-color:var(--theme-surface);
  color:var(--theme-text);
  border-color:var(--theme-border);
}
.table-light,.table-light>th,.table-light>td,thead{background-color:var(--theme-surface)!important;color:var(--theme-text);}
.form-control::placeholder,textarea::placeholder{color:var(--theme-muted);opacity:1;}
.fixed-hr{border-top-color:var(--theme-text);}
.box-title{background:var(--theme-surface);color:var(--theme-text);}

.theme-picker .btn{background:var(--theme-surface);color:var(--theme-text);border-color:var(--theme-border);}
.theme-picker .dropdown-item{display:flex;align-items:center;gap:.5rem;color:var(--theme-text);}
.theme-picker .dropdown-item:hover{background:var(--theme-accent-2);}
.theme-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.theme-dot-default{background:#7db0e2;}
.theme-dot-chatgpt{background:#10a37f;}
.theme-dot-github{background:#0969da;}
.theme-dot-shopee{background:#ee4d2d;}

.theme-dot-tiktok{background:linear-gradient(135deg,#25f4ee 0 33%,#000 33% 66%,#fe2c55 66%);}

/* Default */
body[data-theme="default"]{
  --theme-bg:#ffffff;--theme-surface:#ffffff;--theme-sidebar:#eef3fbc6;
  --theme-accent:#0d6efd;--theme-accent-2:#7db0e2c6;--theme-text:#212529;--theme-muted:#6c757d;--theme-border:#dee2e6;
}
/* ChatGPT */
body[data-theme="chatgpt"]{
  --theme-bg:#f7f7f8;--theme-surface:#ffffff;--theme-sidebar:#ececf1;
  --theme-accent:#10a37f;--theme-accent-2:#d7f3ea;--theme-text:#202123;--theme-muted:#6e6e80;--theme-border:#d9d9e3;
}
/* GitHub */
body[data-theme="github"]{
  --theme-bg:#f6f8fa;--theme-surface:#ffffff;--theme-sidebar:#f6f8fa;
  --theme-accent:#0969da;--theme-accent-2:#ddf4ff;--theme-text:#24292f;--theme-muted:#57606a;--theme-border:#d0d7de;
}
/* Shopee */
body[data-theme="shopee"]{
  --theme-bg:#fff7f3;--theme-surface:#ffffff;--theme-sidebar:#fff0e8;
  --theme-accent:#ee4d2d;--theme-accent-2:#ffd8cc;--theme-text:#2b2b2b;--theme-muted:#777;--theme-border:#f2c6ba;
}
/* TikTok */
body[data-theme="tiktok"]{
  --theme-bg:#0f0f0f;--theme-surface:#171717;--theme-sidebar:#121212;
  --theme-accent:#fe2c55;--theme-accent-2:#243638;--theme-text:#f5f5f5;--theme-muted:#b3b3b3;--theme-border:#333;
}
body[data-theme="tiktok"] .btn-close{filter:invert(1);}
body[data-theme="tiktok"] .table-hover>tbody>tr:hover>*{color:var(--theme-text);background-color:#202020;}

.publication-search .btn{min-width:58px;}

.theme-picker{position:relative;z-index:1060;}
.theme-picker .dropdown-menu{z-index:1070;pointer-events:auto;}
.theme-picker .dropdown-item{cursor:pointer;}
.theme-picker .dropdown-item.active{
  background:var(--theme-accent);
  color:#fff!important;
}
.theme-picker .dropdown-toggle::after{margin-left:auto;}


/* =========================================================
   THEME UI PASS
   Each theme now changes component language, not just colors.
   ========================================================= */

body[data-theme]{
  --theme-canvas:var(--theme-bg);
  --theme-card:var(--theme-surface);
  --theme-card-alt:var(--theme-surface);
  --theme-radius:10px;
  --theme-radius-lg:14px;
  --theme-control-height:42px;
  --theme-shadow:none;
  --theme-section-border:1px solid var(--theme-border);
  --theme-heading-weight:650;
  --theme-input-bg:var(--theme-surface);
  --theme-table-head:var(--theme-surface);
  font-family:var(--theme-font, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif);
}

body[data-theme] main{
  background:var(--theme-canvas);
  color:var(--theme-text);
}

body[data-theme] h1,
body[data-theme] h2,
body[data-theme] h3,
body[data-theme] h4,
body[data-theme] h5{
  color:var(--theme-text);
  font-weight:var(--theme-heading-weight);
}

body[data-theme] .full-screen-section>.container{
  transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease,border-radius .2s ease;
}

body[data-theme] .form-control,
body[data-theme] .form-select{
  min-height:var(--theme-control-height);
  background:var(--theme-input-bg);
  color:var(--theme-text);
  border-color:var(--theme-border);
  border-radius:var(--theme-radius);
  transition:border-color .15s ease,box-shadow .15s ease,background-color .15s ease;
}

body[data-theme] .form-control:focus,
body[data-theme] .form-select:focus{
  background:var(--theme-input-bg);
  color:var(--theme-text);
  border-color:var(--theme-accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--theme-accent) 18%, transparent);
}

body[data-theme] .input-group-text{
  background:var(--theme-card-alt);
  color:var(--theme-text);
  border-color:var(--theme-border);
}

body[data-theme] .modal-content{
  border:1px solid var(--theme-border);
  border-radius:var(--theme-radius-lg);
  box-shadow:var(--theme-shadow);
  overflow:hidden;
}

body[data-theme] .modal-header,
body[data-theme] .modal-footer{
  border-color:var(--theme-border);
}

body[data-theme] .dropdown-menu{
  border:1px solid var(--theme-border);
  border-radius:var(--theme-radius);
  box-shadow:var(--theme-shadow);
  padding:.4rem;
}

body[data-theme] .dropdown-item{
  border-radius:calc(var(--theme-radius) - 2px);
}

body[data-theme] .table{
  --bs-table-bg:transparent;
  --bs-table-color:var(--theme-text);
  --bs-table-border-color:var(--theme-border);
  color:var(--theme-text);
}

body[data-theme] .table thead th{
  background:var(--theme-table-head)!important;
  color:var(--theme-text);
}

body[data-theme] .btn{
  border-radius:var(--theme-radius);
  font-weight:550;
}

body[data-theme] .btn-primary{
  background:var(--theme-accent);
  border-color:var(--theme-accent);
  color:#fff;
}

body[data-theme] .btn-primary:hover{
  background:var(--theme-primary-hover,var(--theme-accent));
  border-color:var(--theme-primary-hover,var(--theme-accent));
  filter:none;
}

body[data-theme] .theme-picker>.btn{
  min-height:40px;
  justify-content:center!important;
  font-weight:600;
  letter-spacing:.01em;
}

body[data-theme] .theme-picker>.btn span{
  width:100%;
  text-align:center;
}

body[data-theme] .theme-picker .dropdown-item{
  min-height:40px;
  padding:.55rem .75rem;
}

/* ---------- Default: source-site inspired ---------- */
body[data-theme="default"]{
  --theme-font:Arial, Helvetica, sans-serif;
  --theme-canvas:#ffffff;
  --theme-card:#ffffff;
  --theme-card-alt:#f8f9fa;
  --theme-accent:#0d6efd;
  --theme-primary-hover:#0b5ed7;
  --theme-text:#212529;
  --theme-muted:#6c757d;
  --theme-border:#dee2e6;
  --theme-sidebar:#eef3fbc6;
  --theme-accent-2:#7db0e2c6;
  --theme-radius:6px;
  --theme-radius-lg:8px;
  --theme-shadow:0 10px 30px rgba(0,0,0,.12);
  --theme-table-head:#f8f9fa;
  --theme-input-bg:#ffffff;
}

/* ---------- ChatGPT: soft neutral workspace, roomy rounded controls ---------- */
body[data-theme="chatgpt"]{
  --theme-font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --theme-canvas:#ffffff;
  --theme-card:#ffffff;
  --theme-card-alt:#f7f7f8;
  --theme-accent:#10a37f;
  --theme-primary-hover:#0d8f70;
  --theme-text:#202123;
  --theme-muted:#6e6e80;
  --theme-border:#e5e5e5;
  --theme-sidebar:#f7f7f8;
  --theme-accent-2:#ececf1;
  --theme-radius:14px;
  --theme-radius-lg:18px;
  --theme-shadow:0 14px 40px rgba(0,0,0,.10);
  --theme-table-head:#f7f7f8;
  --theme-input-bg:#ffffff;
  --theme-heading-weight:600;
}
body[data-theme="chatgpt"] .sidebar{
  border-right:0;
  padding-top:6px;
}
body[data-theme="chatgpt"] .sidebar h3{
  font-size:1.05rem;
  text-align:left;
  padding-left:.5rem;
}
body[data-theme="chatgpt"] .sidebar .nav-link{
  border-radius:10px;
  padding:.6rem .7rem;
  margin:1px 0;
  font-size:.94rem;
}
body[data-theme="chatgpt"] .sidebar .nav-link.active{
  background:#ececf1;
  font-weight:600;
}
body[data-theme="chatgpt"] .full-screen-section>.container{
  max-width:1040px;
  padding-left:2rem;
  padding-right:2rem;
}
body[data-theme="chatgpt"] .full-screen-section:not(.welcome-section)>.container{
  background:#fff;
}
body[data-theme="chatgpt"] .input-group-text{
  background:#f7f7f8;
  border-color:#e5e5e5;
}
body[data-theme="chatgpt"] .btn-primary{
  border-radius:999px;
  padding-left:1.15rem;
  padding-right:1.15rem;
}
body[data-theme="chatgpt"] .table-wrapper{
  border:1px solid #e5e5e5;
  border-radius:14px;
  overflow:auto;
}
body[data-theme="chatgpt"] .table{
  margin-bottom:0;
}
body[data-theme="chatgpt"] .fixed-hr{
  opacity:.16;
}
body[data-theme="chatgpt"] .modal-content{
  border:0;
}

/* ---------- GitHub: Primer-like dense surfaces and crisp borders ---------- */
body[data-theme="github"]{
  --theme-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Noto Sans,Helvetica,Arial,sans-serif;
  --theme-canvas:#f6f8fa;
  --theme-card:#ffffff;
  --theme-card-alt:#f6f8fa;
  --theme-accent:#1f883d;
  --theme-primary-hover:#1a7f37;
  --theme-text:#1f2328;
  --theme-muted:#656d76;
  --theme-border:#d0d7de;
  --theme-sidebar:#ffffff;
  --theme-accent-2:#ddf4ff;
  --theme-radius:6px;
  --theme-radius-lg:6px;
  --theme-shadow:0 8px 24px rgba(140,149,159,.18);
  --theme-table-head:#f6f8fa;
  --theme-input-bg:#ffffff;
  --theme-heading-weight:600;
}
body[data-theme="github"] .sidebar{
  border-right:1px solid #d0d7de;
}
body[data-theme="github"] .sidebar .nav-link{
  border-radius:6px;
  padding:.45rem .6rem;
  font-size:.9rem;
}
body[data-theme="github"] .sidebar .nav-link.active{
  background:#ddf4ff;
  box-shadow:inset 3px 0 #0969da;
}
body[data-theme="github"] .full-screen-section:not(.welcome-section)>.container{
  background:#fff;
  border:1px solid #d0d7de;
  border-radius:6px;
  padding:24px;
  margin-top:18px;
  margin-bottom:40px;
  box-shadow:0 1px 0 rgba(27,31,36,.04);
}
body[data-theme="github"] .table-wrapper{
  border:1px solid #d0d7de;
  border-radius:6px;
  overflow:auto;
}
body[data-theme="github"] .table{
  margin-bottom:0;
}
body[data-theme="github"] .table thead th{
  font-size:.86rem;
  font-weight:600;
}
body[data-theme="github"] .btn-outline-secondary{
  border-color:#d0d7de;
  box-shadow:0 1px 0 rgba(27,31,36,.04);
}
body[data-theme="github"] .form-control:focus,
body[data-theme="github"] .form-select:focus{
  border-color:#0969da;
  box-shadow:0 0 0 3px rgba(9,105,218,.16);
}
body[data-theme="github"] a:not(.btn):not(.nav-link):not(.dropdown-item){
  color:#0969da;
}

/* ---------- Shopee: orange commerce canvas, elevated white cards ---------- */
body[data-theme="shopee"]{
  --theme-font:Arial,"Helvetica Neue",sans-serif;
  --theme-canvas:#f5f5f5;
  --theme-card:#ffffff;
  --theme-card-alt:#fff7f3;
  --theme-accent:#ee4d2d;
  --theme-primary-hover:#d73211;
  --theme-text:#222222;
  --theme-muted:#777777;
  --theme-border:#e8e8e8;
  --theme-sidebar:#ffffff;
  --theme-accent-2:#fff0e8;
  --theme-radius:3px;
  --theme-radius-lg:4px;
  --theme-shadow:0 2px 12px rgba(0,0,0,.10);
  --theme-table-head:#fff7f3;
  --theme-input-bg:#ffffff;
  --theme-heading-weight:500;
}
body[data-theme="shopee"]::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(90deg,#f53d2d,#f63);
  z-index:2000;
}
body[data-theme="shopee"] .sidebar{
  border-right:1px solid #eee;
  box-shadow:2px 0 12px rgba(0,0,0,.04);
}
body[data-theme="shopee"] .sidebar h3{
  color:#ee4d2d!important;
}
body[data-theme="shopee"] .sidebar .nav-link{
  border-radius:0;
  border-left:3px solid transparent;
}
body[data-theme="shopee"] .sidebar .nav-link.active{
  background:#fff4ef;
  color:#ee4d2d!important;
  border-left-color:#ee4d2d;
}
body[data-theme="shopee"] .full-screen-section:not(.welcome-section)>.container{
  background:#fff;
  padding:26px;
  margin-top:20px;
  margin-bottom:38px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}
body[data-theme="shopee"] .full-screen-section:not(.welcome-section) h1{
  color:#ee4d2d;
}
body[data-theme="shopee"] .table-wrapper{
  border-top:2px solid #ee4d2d;
  background:#fff;
}
body[data-theme="shopee"] .btn-primary{
  text-transform:none;
  box-shadow:none;
}
body[data-theme="shopee"] .form-control:focus,
body[data-theme="shopee"] .form-select:focus{
  box-shadow:0 0 0 2px rgba(238,77,45,.16);
}


body[data-theme="tiktok"]{
  --theme-font:ProximaNova,Arial,Tahoma,PingFangSC,sans-serif;
  --theme-canvas:#0f0f0f;
  --theme-card:#121212;
  --theme-card-alt:#1f1f1f;
  --theme-accent:#fe2c55;
  --theme-primary-hover:#e9274d;
  --theme-text:#f1f1f2;
  --theme-muted:#a7a7ab;

  --theme-sidebar:#000000;

}
body[data-theme="tiktok"] .sidebar{
  border-right:1px solid #2f2f2f;
}
body[data-theme="tiktok"] .sidebar h3{
  color:#fff!important;
}
body[data-theme="tiktok"] .sidebar .nav-link{
  color:#f1f1f2!important;
  border-radius:4px;
  padding:.7rem .7rem;
  font-weight:600;
}
body[data-theme="tiktok"] .sidebar .nav-link:hover{
  background:#161823;
}
body[data-theme="tiktok"] .sidebar .nav-link.active{
  background:#1f1f1f;
  color:#fff!important;
  box-shadow:inset 3px 0 #25f4ee,inset 6px 0 #fe2c55;
}
body[data-theme="tiktok"] .full-screen-section:not(.welcome-section)>.container{
  background:#121212;

body[data-theme="tiktok"] .btn-primary{

  box-shadow:-2px 0 #25f4ee,2px 0 #fe2c55;

body[data-theme="tiktok"] .btn-outline-secondary{

}
body[data-theme="tiktok"] .table-wrapper{
  border:1px solid #2f2f2f;
  border-radius:8px;
  overflow:auto;
}
body[data-theme="tiktok"] .table tbody tr:hover>*{
  background:#181818!important;
}
body[data-theme="tiktok"] .form-check-input{
  background-color:#2f2f2f;
  border-color:#555;
}
body[data-theme="tiktok"] .form-check-input:checked{
  background-color:#fe2c55;
  border-color:#fe2c55;
}
body[data-theme="tiktok"] .fixed-hr{
  border-top-color:#2f2f2f;
  opacity:1;
}
body[data-theme="tiktok"] .text-muted{

/* Better responsive theme cards */
@media (max-width: 767.98px){
  body[data-theme="github"] .full-screen-section:not(.welcome-section)>.container,
  body[data-theme="shopee"] .full-screen-section:not(.welcome-section)>.container,
  body[data-theme="tiktok"] .full-screen-section:not(.welcome-section)>.container{
    margin-top:8px;
    margin-bottom:24px;
    padding:16px;
  }
}


/* Publication search -> manual entry flow */
.publication-search-modal .publication-search-body{
  min-height:520px;
  display:flex;
  flex-direction:column;
}
.publication-search-results{
  flex:1;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:22px;
}
.publication-manual-link{
  font-size:1rem;
  text-decoration:underline;
}
.publication-search-modal .modal-footer{
  min-height:72px;
}


/* Original publication layouts */
.publication-original-dialog{
  --bs-modal-width:1340px;
  width:min(96vw,1340px);
  max-width:1340px;
}
.original-modal-header{
  min-height:104px;
  display:grid;
  grid-template-columns:110px 1fr 110px;
  align-items:center;
  border-bottom:1px solid var(--theme-border);
  padding:0 24px;
}
.original-modal-header .modal-title{
  text-align:center;
  font-size:1.9rem;
  font-weight:600;
}
.original-close-btn{
  justify-self:start;
  color:#777;
  font-size:1.7rem;
  border:0;
  background:transparent;
}
.original-add-btn{
  justify-self:end;
  min-width:82px;
  min-height:56px;
  font-size:1.25rem;
}
.original-simple-form{
  padding:24px 24px 36px;
  min-height:620px;
}
.original-simple-form .input-group-text{
  font-size:1.08rem;
  padding-left:18px;
  padding-right:18px;
}
.original-simple-form .form-control,
.original-simple-form .form-select{
  font-size:1.05rem;
  min-height:56px;
}
.original-simple-form textarea.form-control{
  min-height:200px;
  border-radius:6px;
}
.publication-search-modal .publication-search-body{
  padding:24px;
  min-height:710px;
}
.publication-search-modal .publication-search .form-control{
  min-height:56px;
  font-size:1.05rem;
}
.publication-search-modal .publication-search .btn{
  min-width:64px;
  font-size:1.25rem;
}
.publication-search-modal .modal-footer{
  min-height:82px;
  padding:18px 24px;
}
.saved-publication-search{
  height:74px;
  border:1px solid var(--theme-border);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 16px;
  background:var(--theme-surface);
}
.saved-publication-search i{
  font-size:1.65rem;
  color:var(--theme-muted);
}
.saved-publication-search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--theme-text);
  font-size:1.05rem;
}
.saved-publication-search input::placeholder{
  color:var(--theme-muted);
}
.publication-tabs{
  margin-bottom:14px;
}
.publication-tabs .nav-link{
  font-size:1.05rem;
}
@media (max-width:767.98px){
  .publication-original-dialog{width:auto;max-width:calc(100% - 1rem);}
  .original-modal-header{grid-template-columns:54px 1fr 70px;padding:0 10px;min-height:82px;}
  .original-modal-header .modal-title{font-size:1.2rem;}
  .original-add-btn{min-width:62px;min-height:44px;font-size:1rem;}
  .original-simple-form{padding:16px;min-height:auto;}
}


/* Crossref result list */
.publication-search-status{
  margin-top:14px;
  font-size:.98rem;
}
.publication-loading{
  width:100%;
  min-height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  color:var(--theme-muted);
}
.publication-search-empty{
  width:100%;
  padding:36px 16px;
}
.crossref-result-card{
  width:100%;
  display:grid;
  grid-template-columns:28px 1fr;
  gap:12px;
  text-align:left;
  border:1px solid var(--theme-border);
  background:var(--theme-surface);
  color:var(--theme-text);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:10px;
  cursor:pointer;
  transition:border-color .15s ease,box-shadow .15s ease,background-color .15s ease;
}
.crossref-result-card:hover{
  border-color:var(--theme-accent);
  background:color-mix(in srgb,var(--theme-accent) 5%,var(--theme-surface));
}
.crossref-result-card.selected{
  border-color:var(--theme-accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--theme-accent) 18%,transparent);
}
.crossref-result-select{
  padding-top:4px;
}
.crossref-result-select span{
  display:block;
  width:18px;
  height:18px;
  border:2px solid var(--theme-border);
  border-radius:50%;
  background:var(--theme-surface);
}
.crossref-result-card.selected .crossref-result-select span{
  border:5px solid var(--theme-accent);
}
.crossref-result-title{
  font-weight:700;
  line-height:1.35;
  margin-bottom:6px;
}
.crossref-result-meta{
  color:var(--theme-muted);
  font-size:.94rem;
  margin-top:2px;
}
.crossref-result-identifiers{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:7px;
  color:var(--theme-muted);
  font-size:.86rem;
}
.publication-search-results{
  display:block;
  overflow-y:auto;
  padding-top:18px;
}
.publication-search-footer{
  display:flex;
  align-items:center;
  gap:16px;
}
.publication-pagination{
  display:flex;
  align-items:center;
  gap:18px;
}
.publication-page-btn{
  width:52px;
  height:48px;
}
#articleSearchAddBtn:disabled{
  opacity:.55;
  cursor:not-allowed;
}
@media (max-width:767.98px){
  .publication-search-footer{
    flex-direction:column;
    align-items:stretch;
  }
  .publication-pagination{
    margin-left:0!important;
    justify-content:center;
  }
}


/* ===== Data-entry quality improvements ===== */
.compact-date{max-width:190px;}
.compact-phone{max-width:180px;}
.compact-id{max-width:220px;}
.compact-location{min-width:220px;}
.compact-ethnicity{min-width:180px;}

.capslock-on{
  border-color:#dc3545!important;
  box-shadow:0 0 0 3px rgba(220,53,69,.12)!important;
}

#credentialBody tr,
#projectBody tr,
#articleBody tr{
  transition:background-color .15s ease;
}
#articleBody .btn-sm{
  --bs-btn-padding-y:.22rem;
  --bs-btn-padding-x:.45rem;
}

.export-template-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.export-template-option{
  display:flex;
  gap:10px;
  align-items:flex-start;
  border:1px solid var(--theme-border);
  background:var(--theme-surface);
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}
.export-template-option:hover{
  border-color:var(--theme-accent);
}
.export-template-option input{
  margin-top:4px;
}
.export-template-option span{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.export-template-option small{
  color:var(--theme-muted);
}
.export-preview-paper{
  min-height:620px;
  background:#fff;
  color:#111;
  border:1px solid #d7d7d7;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  padding:42px 48px;
  font-family:"Times New Roman",serif;
  font-size:15px;
  overflow:auto;
}
.export-preview-paper h3{
  color:#111!important;
  font-family:"Times New Roman",serif;
  font-weight:700;
}
.export-preview-paper h5{
  color:#111!important;
  margin-top:18px;
  font-family:"Times New Roman",serif;
  font-weight:700;
}
.export-preview-paper table{
  width:100%;
  border-collapse:collapse;
  margin:8px 0 16px;
}
.export-preview-paper td{
  border:1px solid #333;
  padding:6px;
  vertical-align:top;
}

.sync-panel{
  background:color-mix(in srgb,var(--theme-accent) 3%,var(--theme-surface));
}

@media (min-width:768px){
  #general .input-group > .compact-date{flex:0 0 190px;}
  #general .input-group > .compact-phone{flex:0 0 160px;}
  #general .input-group > .compact-id{flex:0 0 220px;}
}

@media (max-width:767.98px){
  .compact-date,.compact-phone,.compact-id,.compact-location,.compact-ethnicity{
    max-width:none;
    min-width:100%;
  }
  .export-preview-paper{
    padding:24px 18px;
    min-height:420px;
  }
}


/* Education table selection / actions */
#credentialTable th:first-child,
#credentialTable td:first-child{
  width:54px;
  text-align:center;
}
.credential-row-actions{
  justify-content:flex-start;
}
.credential-bulk-actions{
  background:color-mix(in srgb,var(--theme-accent) 2%,var(--theme-surface));
}
.credential-detail-text{
  min-height:24px;
}
#credentialBody tr:has(.credential-row-check:checked){
  background:color-mix(in srgb,var(--theme-accent) 7%,var(--theme-surface));
}


/* Unified row selection / edit controls */
.managed-table .select-col,
.managed-table td:first-child,
#articleTab th.select-col,
#articleTab td:first-child{
  width:54px;
  min-width:54px;
  text-align:center;
  vertical-align:middle;
}
.managed-row-check,
.managed-table thead .form-check-input,
#articleSelectAll{
  width:22px;
  height:22px;
  background-color:#fff!important;
  border:1.5px solid #c8ced6!important;
  box-shadow:none!important;
  cursor:pointer;
}
.managed-row-check:checked,
.managed-table thead .form-check-input:checked,
#articleSelectAll:checked{
  background-color:var(--theme-accent)!important;
  border-color:var(--theme-accent)!important;
}
.managed-row-check:focus,
.managed-table thead .form-check-input:focus,
#articleSelectAll:focus{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--theme-accent) 18%,transparent)!important;
}
.data-bulk-actions,
.credential-bulk-actions{
  background:color-mix(in srgb,var(--theme-accent) 2.5%,var(--theme-surface));
  position:sticky;
  bottom:0;
  z-index:2;
}
.data-bulk-actions .btn,
.credential-bulk-actions .btn{
  min-height:38px;
  font-weight:600;
}
.managed-table tbody tr:has(.managed-row-check:checked),
#articleBody tr:has(.managed-row-check:checked){
  background:color-mix(in srgb,var(--theme-accent) 8%,var(--theme-surface))!important;
}
.managed-edit-btn,
.managed-delete-btn,
.article-edit-btn,
.article-delete-btn{
  min-width:36px;
}
@media (max-width:767.98px){
  .data-bulk-actions,
  .credential-bulk-actions{
    justify-content:flex-start!important;
  }
}

  --theme-accent-2:#0b77b4;

  --theme-radius-lg:22px;
  --theme-shadow:0 2px 8px rgba(0,0,0,.08);
