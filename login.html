<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hồ sơ khoa học</title>
  <link rel="stylesheet" href="./auth.css?v=2">
</head>
<body>
  <nav class="auth-navbar"><div class="auth-nav-inner">
    <a href="./login.html" class="auth-brand">📄 Hồ sơ khoa học</a>
    <div class="auth-nav-actions"><a href="./register.html" class="auth-btn auth-btn-primary">Register</a></div>
  </div></nav>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header"><h1>Welcome Back</h1><p>Login to access your scientific profile</p></div>
      <div id="authMessage" class="d-none"></div>
      <form id="loginForm" class="auth-form" novalidate>
        <div class="auth-group"><label for="id_username">Username</label><input class="auth-input" id="id_username" name="username" placeholder="Enter your username" autocomplete="username" required></div>
        <div class="auth-group"><label for="id_password">Password</label><input class="auth-input" type="password" id="id_password" name="password" placeholder="Enter your password" autocomplete="current-password" required></div>
        <button class="auth-btn auth-btn-primary auth-btn-full" type="submit">Login</button>
      </form>
      <div class="auth-footer"><p>Don't have an account? <a href="./register.html">Register here</a></p></div>
    </div>
  </main>
  <footer class="auth-footerbar">© 2026 Hồ sơ khoa học</footer>
  <script src="./auth.js?v=2"></script>
</body></html>
