<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hồ sơ khoa học</title>
  <link rel="stylesheet" href="./auth.css?v=2">
</head>
<body>
  <nav class="auth-navbar"><div class="auth-nav-inner">
    <a href="./login.html" class="auth-brand">Hồ sơ khoa học</a>
    <div class="auth-nav-actions"><a href="./register.html" class="auth-btn auth-btn-primary">Đăng ký</a></div>
  </div></nav>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header"><h1>Chào mừng trở lại</h1><p>Đăng nhập để truy cập hồ sơ khoa học của bạn</p></div>
      <div id="authMessage" class="d-none"></div>
      <form id="loginForm" class="auth-form" novalidate>
        <div class="auth-group"><label for="id_username">Tên đăng nhập</label><input class="auth-input" id="id_username" name="username" placeholder="Nhập tên đăng nhập" autocomplete="username" required></div>
        <div class="auth-group"><label for="id_password">Mật khẩu</label><input class="auth-input" type="password" id="id_password" name="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required></div>
        <button class="auth-btn auth-btn-primary auth-btn-full" type="submit">Đăng nhập</button>
      </form>
      <div class="auth-footer"><p>Chưa có tài khoản? <a href="./register.html">Đăng ký tại đây</a></p></div>
    </div>
  </main>
  <footer class="auth-footerbar">© 2026 Hồ sơ khoa học</footer>
  <script src="./auth.js?v=2"></script>
</body></html>
