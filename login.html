<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-sm p-4" style="width:100%;max-width:430px">
    <h3 class="text-center mb-4">Hồ sơ cá nhân</h3>
    {% if form.errors %}<div class="alert alert-danger">Tên đăng nhập hoặc mật khẩu không đúng.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Tên đăng nhập</label><input class="form-control" name="username" autofocus required></div>
      <div class="mb-3"><label class="form-label">Mật khẩu</label><input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-primary w-100">Đăng nhập</button>
    </form>
    <div class="text-center mt-3"><a href="{% url 'register' %}">Tạo tài khoản</a></div>
  </div>
</div>
</body></html>
